name: check-templates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, foxy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base
    defaults:
      run:
        shell: bash
    env:
      PACKAGES: >-
        example-interfaces std-srvs diagnostic-updater message-filters rosbag2-py
        rosbag2-storage-mcap tf2-ros visualization-msgs launch-testing launch-testing-ros
        ament-flake8 sensor-msgs-py
    steps:
      - uses: actions/checkout@v4

      # Foxy is EOL: its image ships an expired apt key and some packages may be gone, so a
      # missing package is reported and handled by the skip-list instead of failing the job.
      - name: Install dependencies
        run: |
          apt-get update || [ "${{ matrix.distro }}" = foxy ]
          missing=""
          for pkg in $PACKAGES; do
            apt-get install -y --no-install-recommends "ros-${{ matrix.distro }}-$pkg" \
              || missing="$missing $pkg"
          done
          echo "missing packages:${missing:- none}"
          [ -z "$missing" ] || [ "${{ matrix.distro }}" = foxy ]

      - name: Lint
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          ament_flake8 templates/*.py scripts/*.py

      - name: Smoke-check templates
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          python3 scripts/check_templates.py

      - name: Integration test
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          if python3 scripts/check_templates.py --is-skipped reference_node; then
            echo "SKIP launch_integration_test (reference_node skipped on ${{ matrix.distro }})"
          else
            launch_test templates/launch_integration_test.py
          fi
